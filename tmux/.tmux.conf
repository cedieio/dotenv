#set -g default-terminal "tmux-256color"
#set -ag terminal-overrides ",xterm-256color:RGB"

set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5
bind -r C-h resize-pane -L 5

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R

bind -r m resize-pane -Z

bind M-c attach-session -c "#{pane_current_path}"

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane #set -g @plugin 'tmux-plugins/tpm'

# Kanagawa Light colors for tmux
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Status bar
set -g status-style 'bg=#f2ecbc fg=#545464'
set -g status-left '#[bg=#7e9cd8,fg=#f2ecbc,bold] #S #[bg=#f2ecbc,fg=#7e9cd8]'
set -g status-right '#[fg=#7e9cd8,bg=#f2ecbc]#[bg=#7e9cd8,fg=#f2ecbc] %H:%M '
set -g status-left-length 100
set -g status-position bottom
set -g status-justify left

# Window status
set -g window-status-current-style 'bg=#7e9cd8 fg=#f2ecbc bold'
set -g window-status-style 'bg=#dcd7ba fg=#545464'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '

# Pane borders
set -g pane-border-style 'fg=#c8c093'
set -g pane-active-border-style 'fg=#7e9cd8'

# Pane colors (the actual terminal background)
set -g window-style 'fg=#545464,bg=#f2ecbc'
set -g window-active-style 'fg=#545464,bg=#f2ecbc'

# Message style
set -g message-style 'bg=#7e9cd8 fg=#f2ecbc'
set -g message-command-style 'bg=#7e9cd8 fg=#f2ecbc'

# Clock mode
set -g clock-mode-colour '#7e9cd8'

run -b '~/.tmux/plugins/tpm/tpm' don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10


